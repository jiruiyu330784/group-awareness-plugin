[plugin]
enabled = true
config_version = "1.0.0"

[scope]
whitelist = []
blacklist = []

[events.group_increase]
enabled = true
mode = "context"
template = "欢迎 {member_name} 加入 {group_name}！"

[events.group_decrease]
enabled = true
mode = "context"
template = ""

[events.group_ban]
enabled = true
mode = "context"
template = ""

[events.group_name]
enabled = true
mode = "context"
template = ""

[events.group_admin]
enabled = true
mode = "context"
template = ""

[self_ban]
mode = "context"
admin_qqs = []

[llm]
model = "planner"
temperature = 1
max_tokens = 0

[probation]
enabled = false
probation_hours = 48
check_interval_minutes = 30
reject_add_request = false
whitelist = []

[probation.greet]
mode = "template"
template = "欢迎新朋友加入～出来冒个泡认识一下？"

[probation.kick_message]
mode = "template"
template = "成员 {member_name}（QQ {user_id}）加入超过 {probation_hours} 小时未发言，已移出群聊。"

[probation.llm]
model = "planner"
temperature = 0.8
max_tokens = 128

